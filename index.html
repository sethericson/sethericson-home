<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>It's the Weekend - Ericson Interactive</title>
<meta name="description" content="It's the weekend. Go outside.">
<meta name="robots" content="noindex">

<link rel="icon" href="https://sethericson.com/favicon.ico" sizes="48x48 96x96">
<link rel="icon" type="image/png" sizes="48x48" href="https://sethericson.com/favicon-48.png">
<link rel="icon" type="image/png" sizes="96x96" href="https://sethericson.com/favicon-96.png">
<link rel="apple-touch-icon" sizes="180x180" href="https://sethericson.com/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com/">
<link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
  :root { color-scheme: dark; }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; position: relative;
    font-family: 'Atkinson Hyperlegible', 'Inter', sans-serif; color: #FFF5F7; overflow-x: hidden;
    background:
      radial-gradient(900px 520px at 12% 0%, rgba(138,21,56,.9), transparent 60%),
      radial-gradient(700px 480px at 100% 100%, rgba(45,6,18,.95), transparent 65%),
      #5A0D24;
    background-attachment: fixed;
  }
  ::selection { background: #f43f5e; color: #fff; }
  .bg-grid {
    position: fixed; inset: 0; z-index: 0; pointer-events: none; background-size: 40px 40px;
    background-image:
      linear-gradient(to right, rgba(255,245,247,.04) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,245,247,.04) 1px, transparent 1px);
  }
  #particle-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }

  main { position: relative; z-index: 10; flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px 16px; }
  .card {
    width: 100%; max-width: 38rem; text-align: center; border-radius: 28px; padding: 44px 22px 40px;
    background: rgba(45,6,18,.6); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    border: 1px solid rgba(255,245,247,.12); box-shadow: 0 20px 50px rgba(0,0,0,.45);
  }
  @media (min-width: 640px) { .card { padding: 60px 48px 52px; } }

  .logo-wrap {
    position: relative; width: 132px; height: 132px; margin: 0 auto 28px; border-radius: 32px; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #8a1538, #3a0a18);
    box-shadow: 0 0 0 1px rgba(255,245,247,.18), 0 18px 44px rgba(0,0,0,.5), 0 0 60px rgba(244,63,94,.25);
    animation: float 4s ease-in-out infinite;
  }
  .logo-wrap img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .logo-wrap .fallback { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 3rem; letter-spacing: -.02em; color: #fff; }
  @keyframes float { 50% { transform: translateY(-8px); } }
  @media (prefers-reduced-motion: reduce) { .logo-wrap { animation: none; } }

  h1 {
    font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; letter-spacing: -.02em; line-height: 1.08; margin: 0;
    font-size: clamp(2.4rem, 9vw, 4rem); color: #fff;
  }
  h1 span { display: block; background: linear-gradient(90deg, #fecdd3, #ffe4e9, #fda4af); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
  footer { position: relative; z-index: 10; text-align: center; padding: 0 16px 24px; color: rgba(255,205,215,.55); font-size: .8125rem; }
</style>
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <canvas id="particle-canvas" aria-hidden="true"></canvas>

  <main>
    <section class="card" aria-labelledby="title">
      <div class="logo-wrap">
        <span class="fallback" aria-hidden="true">SE</span>
        <img src="https://sethericson.com/apple-touch-icon.png" alt="Seth Ericson logo" width="132" height="132" onerror="this.style.display='none'">
      </div>
      <h1 id="title">It&rsquo;s the weekend.<span>Go outside.</span></h1>
    </section>
  </main>

  <footer>Ericson Interactive</footer>

<script>
  (function () {
    var canvas = document.getElementById('particle-canvas');
    var ctx = canvas.getContext && canvas.getContext('2d');
    if (!ctx || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var w, h, ps = [];
    function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize); resize();
    for (var i = 0; i < 45; i++) ps.push({ x: Math.random() * w, y: Math.random() * h, s: Math.random() * 2 + .5,
      vx: (Math.random() - .5) * .3, vy: (Math.random() - .5) * .3, a: Math.random() * .4 + .1 });
    (function tick() {
      ctx.clearRect(0, 0, w, h);
      ps.forEach(function (p) {
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0) p.x = w; if (p.x > w) p.x = 0; if (p.y < 0) p.y = h; if (p.y > h) p.y = 0;
        ctx.fillStyle = 'rgba(255,238,242,' + p.a + ')'; ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, Math.PI * 2); ctx.fill();
      });
      requestAnimationFrame(tick);
    })();
  })();
</script>

</body>
</html>
