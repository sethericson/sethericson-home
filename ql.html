<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuickLearn | The most efficient AI study tool</title>
<style>
  :root {
    --bg: #0f1014;
    --fg: #eceef4;
    --muted: #8d93a6;
    --accent: #ff3b4e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding-block: 24px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  h1 { margin: 0; font-size: clamp(26px, 5vw, 40px); letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }
  .player {
    width: min(100%, 420px);
    aspect-ratio: 9 / 16;
    max-height: calc(100vh - 150px);
    background: #000;
    border-radius: 14px;
    overflow: hidden;
  }
  .player iframe { width: 100%; height: 100%; border: 0; display: block; }
  .player.wide {
    width: min(100%, 800px);
    aspect-ratio: 16 / 9;
    max-height: none;
  }
  a { color: var(--accent); text-decoration: none; font-size: 14px; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <h1>Not <span>Shorts</span></h1>
  <div class="player">
    <iframe
      src="https://www.youtube-nocookie.com/embed/zj5e7uTJHRM?rel=0&playsinline=1"
      title="YouTube video player"
      allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen></iframe>
  </div></body>
</html>
