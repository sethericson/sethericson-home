<script>
  (function () {
    var canvas = document.getElementById('particle-canvas');
    var ctx = canvas.getContext && canvas.getContext('2d');
    if (!ctx || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var w, h, ps = [];
    function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize); resize();
    for (var i = 0; i < 45; i++) ps.push({ x: Math.random() * w, y: Math.random() * h, s: Math.random() * 2 + .5,
      vx: (Math.random() - .5) * .3, vy: (Math.random() - .5) * .3, a: Math.random() * .4 + .1 });
    (function tick() {
      ctx.clearRect(0, 0, w, h);
      ps.forEach(function (p) {
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0) p.x = w; if (p.x > w) p.x = 0; if (p.y < 0) p.y = h; if (p.y > h) p.y = 0;
        ctx.fillStyle = 'rgba(255,238,242,' + p.a + ')'; ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, Math.PI * 2); ctx.fill();
      });
      requestAnimationFrame(tick);
    })();
  })();
</script>
